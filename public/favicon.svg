<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hexagon Border Gradient -->
    <linearGradient id="hex-border-grad" x1="12" y1="88" x2="88" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00F5D4" />
      <stop offset="25%" stopColor="#00D2FF" />
      <stop offset="65%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>

    <!-- Outer Hex Glow -->
    <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Blue Sphere Gradient (Center Node) -->
    <radialGradient id="node-blue-center" cx="44%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#70E4FF" />
      <stop offset="30%" stopColor="#00A2FF" />
      <stop offset="75%" stopColor="#0052D4" />
      <stop offset="100%" stopColor="#002D80" />
    </radialGradient>

    <!-- 3D Blue Floating Spheres -->
    <radialGradient id="node-blue-small" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stopColor="#8AE9FF" />
      <stop offset="35%" stopColor="#00A2FF" />
      <stop offset="80%" stopColor="#0057E7" />
      <stop offset="100%" stopColor="#00318A" />
    </radialGradient>

    <!-- 3D Emerald-Mint Sphere Gradient (Bottom Left) -->
    <radialGradient id="node-emerald" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stopColor="#80FFDB" />
      <stop offset="28%" stopColor="#2CE8B5" />
      <stop offset="68%" stopColor="#00B884" />
      <stop offset="100%" stopColor="#006648" />
    </radialGradient>

    <!-- Upper Slanted Capsule Gradient -->
    <linearGradient id="capsule-upper-grad" x1="26" y1="46" x2="55" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00A8FF" />
      <stop offset="45%" stopColor="#00D8FF" />
      <stop offset="100%" stopColor="#0066FF" />
    </linearGradient>

    <!-- Lower Slanted Capsule Gradient -->
    <linearGradient id="capsule-lower-grad" x1="52" y1="68" x2="74" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0080FF" />
      <stop offset="45%" stopColor="#00C4FF" />
      <stop offset="100%" stopColor="#0052D4" />
    </linearGradient>

    <!-- Subtle Hex Inner Shadow / Background Gradient -->
    <radialGradient id="hex-bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0A111F" />
      <stop offset="75%" stopColor="#060B14" />
      <stop offset="100%" stopColor="#03060B" />
    </radialGradient>
  </defs>

  <!-- Hexagon Outer Glow Layer -->
  <path
    d="M 45 6.2 Q 50 3.5 55 6.2 L 85.8 24.2 Q 90.5 27 90.5 32.4 L 90.5 67.6 Q 90.5 73 85.8 75.8 L 55 93.8 Q 50 96.5 45 93.8 L 14.2 75.8 Q 9.5 73 9.5 67.6 L 9.5 32.4 Q 9.5 27 14.2 24.2 Z"
    stroke="url(#hex-border-grad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#hex-glow)"
    opacity="0.8"
  />

  <!-- Hexagon Background Solid Dark Body -->
  <path
    d="M 45 6.2 Q 50 3.5 55 6.2 L 85.8 24.2 Q 90.5 27 90.5 32.4 L 90.5 67.6 Q 90.5 73 85.8 75.8 L 55 93.8 Q 50 96.5 45 93.8 L 14.2 75.8 Q 9.5 73 9.5 67.6 L 9.5 32.4 Q 9.5 27 14.2 24.2 Z"
    fill="url(#hex-bg-grad)"
  />

  <!-- Hexagon Crisp Foreground Border -->
  <path
    d="M 45 6.2 Q 50 3.5 55 6.2 L 85.8 24.2 Q 90.5 27 90.5 32.4 L 90.5 67.6 Q 90.5 73 85.8 75.8 L 55 93.8 Q 50 96.5 45 93.8 L 14.2 75.8 Q 9.5 73 9.5 67.6 L 9.5 32.4 Q 9.5 27 14.2 24.2 Z"
    stroke="url(#hex-border-grad)"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- ================= BIOLUMINESCENT NEURAL CLUSTER ================= -->

  <!-- 1. Upper Slanted Metaball / Fluid Capsule -->
  <!-- Base connected hull -->
  <path
    d="M 39.5 26.5 C 46 22 56 25 56 32.5 C 56 37 51 40 46 41 C 42 42 41 45.5 38 49 C 32 55 24 50 25.5 42 C 26.5 36 32 32 35.5 30.5 Z"
    fill="url(#capsule-upper-grad)"
  />
  <!-- Top Bulb Specular Glow -->
  <ellipse cx="49.5" cy="30" rx="4.5" ry="3.5" transform="rotate(-35 49.5 30)" fill="#A8F4FF" opacity="0.8" />
  <!-- Bottom Bulb Specular Glow -->
  <ellipse cx="32" cy="42" rx="4.8" ry="3.8" transform="rotate(-35 32 42)" fill="#8AE8FF" opacity="0.8" />

  <!-- 2. Lower-Right Slanted Metaball / Fluid Capsule -->
  <!-- Base connected hull -->
  <path
    d="M 64.5 46 C 71 43 78.5 47 77.5 54.5 C 76.5 60.5 71 63 67 64 C 63 65 61.5 68 59 71.5 C 54 78 46.5 74 48 66 C 49 60 55 56.5 59 54.5 Z"
    fill="url(#capsule-lower-grad)"
  />
  <!-- Top-Right Bulb Specular Glow -->
  <ellipse cx="71.5" cy="50" rx="4.5" ry="3.5" transform="rotate(-35 71.5 50)" fill="#94E9FF" opacity="0.85" />
  <!-- Lower Bulb Specular Glow -->
  <ellipse cx="54.5" cy="65" rx="4.8" ry="3.8" transform="rotate(-35 54.5 65)" fill="#78D8FF" opacity="0.8" />

  <!-- 3. Center Glowing 3D Sphere -->
  <circle cx="50" cy="47.5" r="8.2" fill="url(#node-blue-center)" />
  <ellipse cx="48" cy="44.5" rx="3.5" ry="2.2" fill="#B3F3FF" opacity="0.75" />

  <!-- 4. Bottom-Left Trio of Emerald / Mint Spheres -->
  <!-- Left-most Emerald Node -->
  <circle cx="26" cy="58" r="6.8" fill="url(#node-emerald)" />
  <ellipse cx="24.2" cy="55.5" rx="2.8" ry="1.8" fill="#BFFFF0" opacity="0.8" />

  <!-- Middle-Top Emerald Node -->
  <circle cx="39.5" cy="58" r="7.0" fill="url(#node-emerald)" />
  <ellipse cx="37.5" cy="55.5" rx="2.9" ry="1.9" fill="#BFFFF0" opacity="0.8" />

  <!-- Bottom Emerald Node -->
  <circle cx="38" cy="71.8" r="7.0" fill="url(#node-emerald)" />
  <ellipse cx="36" cy="69.2" rx="2.9" ry="1.9" fill="#BFFFF0" opacity="0.8" />

  <!-- 5. Top-Right Floating Small Spheres -->
  <!-- Node A (Top tiny) -->
  <circle cx="57.5" cy="24" r="3.4" fill="url(#node-blue-small)" />
  <ellipse cx="56.5" cy="23" rx="1.4" ry="0.9" fill="#D6F8FF" opacity="0.85" />

  <!-- Node B (Far right) -->
  <circle cx="70.5" cy="28" r="3.0" fill="url(#node-blue-small)" />
  <ellipse cx="69.5" cy="27" rx="1.2" ry="0.8" fill="#D6F8FF" opacity="0.85" />

  <!-- Node C (Mid-right) -->
  <circle cx="62" cy="35.5" r="4.8" fill="url(#node-blue-small)" />
  <ellipse cx="60.5" cy="34" rx="2.0" ry="1.3" fill="#C4F5FF" opacity="0.8" />
</svg>
